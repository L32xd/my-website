<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#edf2ef">
  <meta name="description" content="十个电池位，两排五列展示电池电量、电压、电流、温度、容量和充电次数。">
  <title>电池BMS管理系统</title>
  <style>
    :root { color-scheme: light; --ink: #202b28; --muted: #64756c; --line: #c5d4cb; --green: #338365; --battery-width: clamp(44px, 4.2vw, 66px); }
    * { box-sizing: border-box; }
    html { touch-action: pan-x pan-y; }
    body { height: 100dvh; min-width: 780px; min-height: 640px; margin: 0; display: flex; flex-direction: column; background: linear-gradient(135deg, #e8eeea, #f1f4f2); color: var(--ink); font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    svg { display: block; flex-shrink: 0; }
    .topbar { height: 48px; flex-shrink: 0; border-bottom: 1px solid var(--line); background: #f7faf8; box-shadow: 0 2px 10px #244c3208; }
    .topbar-inner { max-width: 1840px; height: 100%; margin: auto; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; background: #315f49; border-radius: 8px; color: white; }
    .brand-divider { height: 15px; width: 1px; background: #dfe5e1; margin: 0 4px; }
    .brand-subtitle { color: var(--muted); font-size: 11px; font-weight: 400; }
    .snapshot { display: flex; align-items: center; gap: 7px; color: #737c77; font-size: 11px; }
    .snapshot-dot { width: 5px; height: 5px; border-radius: 50%; background: #9da8a1; }
    main { width: 100%; max-width: 1840px; min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 14px 22px 10px; margin: 0 auto; }
    .page-heading { display: flex; flex-shrink: 0; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 650; letter-spacing: -.7px; }
    .description { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .configuration { display: flex; align-items: center; gap: 12px; color: #66716b; font-size: 11px; padding-bottom: 3px; white-space: nowrap; }
    .configuration span + span { border-left: 1px solid #dfe5e1; padding-left: 12px; }
    .configuration b { color: var(--ink); font-size: 13px; font-weight: 600; }
    .battery-grid { min-height: 0; flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .card, .empty-slot { min-width: 0; min-height: 0; border-radius: 14px; }
    .card { position: relative; display: grid; grid-template-rows: auto minmax(min-content, 1fr) auto; padding: 10px; border: 1px solid #aec6b7; background: linear-gradient(180deg, #dfede4 0, #fff 100px); box-shadow: 0 5px 16px #244c3212, inset 0 1px 0 #fff; }
    .card::before { content: ""; position: absolute; top: -1px; left: 18px; right: 18px; height: 2px; background: linear-gradient(90deg, transparent, #599472 35%, #599472 65%, transparent); }
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .card-actions { display: flex; align-items: center; gap: 4px; }
    .remove-slot { flex-shrink: 0; padding: 3px 4px; border: 1px solid #dde5df; border-radius: 5px; background: #fff; color: #8a7373; font-size: 9px; cursor: pointer; }
    .remove-slot:hover { border-color: #d2aaa6; background: #fff5f3; color: #a74e45; }
    h2 { margin: 0; font-size: clamp(12px, 1.05vw, 16px); font-weight: 650; white-space: nowrap; }
    .state { display: inline-flex; align-items: center; gap: 4px; padding: 3px 5px; border-radius: 5px; background: #f0f5f1; color: #6b7770; font-size: 9px; white-space: nowrap; }
    .state::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: #8e9c92; }
    .state.waiting { background: #f3f4f3; color: #8a938d; }
    .card.has-alert { border-color: #d58b74; background: linear-gradient(180deg, #fff0e8 0, #fff 80px); }
    .card.has-alert::before { background: linear-gradient(90deg, transparent, #c56d51 35%, #c56d51 65%, transparent); }
    .state.alert-state { border: 0; background: #fbe4da; color: #a33620; cursor: pointer; }
    .state.alert-state::before { content: "!"; width: 11px; height: 11px; display: grid; place-items: center; background: #b4432c; color: #fff; font-size: 8px; font-weight: 700; }
    .battery-stage { display: grid; grid-template-columns: var(--battery-width) minmax(0, 1fr); align-items: center; gap: clamp(7px, 1vw, 18px); padding: 8px 0; }
    .battery { position: relative; width: var(--battery-width); height: clamp(58px, 9dvh, 96px); border: 1.5px solid #9eafa4; border-radius: 11px; padding: 3px; background: white; }
    .battery::before { content: ""; position: absolute; width: 40%; height: 4px; border-radius: 4px 4px 0 0; background: #9eafa4; top: -6px; left: 30%; }
    .battery-inner { position: relative; width: 100%; height: 100%; border-radius: 7px; overflow: hidden; background: #f7faf8; }
    .battery-fill { position: absolute; inset: auto 0 0; height: var(--soc); }
    .battery-fill::after { content: ""; position: absolute; inset: 6px 0 0; background: linear-gradient(180deg, var(--water-top), var(--water-bottom)); }
    .water-wave { position: absolute; top: -6px; left: 0; width: 200%; height: 12px; fill: var(--water-top); }
    .wave-back { top: -8px; fill: var(--water-back); opacity: .45; }
    .soc-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 5px; }
    .soc-value { color: #0c2418; font-size: clamp(20px, 2.1vw, 30px); font-weight: 550; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; }
    .soc-value small { font-size: 10px; margin-left: 1px; letter-spacing: 0; font-weight: 400; }
    .soc-label { color: #244b38; font-size: 7px; margin-top: 4px; }
    .battery.awaiting { border-color: #c7cfca; }
    .battery.awaiting::before { background: #c7cfca; }
    .battery.awaiting .soc-value, .battery.awaiting .soc-label { color: #a1aaa4; }
    .capacity { margin: 0; }
    .capacity > div + div { margin-top: 6px; }
    .capacity dt { font-size: clamp(9px, min(.8vw, 1.4dvh), 11px); line-height: 1.2; color: var(--muted); white-space: nowrap; }
    .capacity dd { margin: 2px 0 0; font-size: clamp(14px, min(1.4vw, 2.2dvh), 21px); line-height: 1.2; font-weight: 550; letter-spacing: -.6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .unit { margin-left: 3px; font-size: 9px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
    .capacity .unit, .capacity sup { font-size: 8px; color: var(--muted); }
    .metrics { position: relative; margin: 0; padding-top: 4px; }
    .metrics::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, #acc7b5 15%, #acc7b5 85%, transparent); }
    .metric-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 5px; padding: clamp(1px, .18dvh, 3px) 7px; border-radius: 5px; transition: background-color .2s ease; }
    .metric-row:nth-child(odd) { background-image: linear-gradient(90deg, #e7f0ea, #f3f7f4); }
    .metric-row + .metric-row::before { content: ""; position: absolute; top: 0; left: 7px; right: 7px; height: 1px; background: linear-gradient(90deg, #c4d8cc, #d8e4dc 70%, transparent); }
    .metric-row:hover { background-color: #e8f2eb; }
    .metric-row dt { font-size: clamp(9px, min(.8vw, 1.4dvh), 12px); color: #65766b; white-space: nowrap; }
    .metric-row dd { margin: 0; font-size: clamp(13px, min(1.05vw, 1.8dvh), 18px); font-weight: 550; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .metric-row:first-child dd { color: #2d674b; }
    .metric-row.is-alert { background: linear-gradient(90deg, #fce5dc, #fff5f1); }
    .metric-row.is-alert dt, .metric-row.is-alert dd, .capacity dd.is-alert { color: #ad3925; }
    .row-alert-marker { margin-right: 3px; font-weight: 700; }
    .empty-slot { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; border: 1px dashed #b2c6b9; background: linear-gradient(145deg, #e1eae5, #eaf0ec); color: #607e6b; cursor: pointer; transition: border-color .2s, background-color .2s, color .2s; }
    .slot-number { position: absolute; top: 12px; left: 12px; font-size: 10px; color: #758d7e; font-variant-numeric: tabular-nums; }
    .add-mark { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #becfc4; border-radius: 12px; background: #f8fbf9; box-shadow: 0 3px 8px #244c320a; }
    .add-label { font-size: 11px; }
    .empty-slot:hover { border-color: #6c9b7c; color: #2d6843; background: #d8e8de; }
    .empty-slot:focus-visible, .card:focus-visible, button:focus-visible { outline: 2px solid #508866; outline-offset: 2px; }
    .page-footer { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; color: #718278; font-size: 9px; line-height: 1.5; }
    .data-note, .capacity-note { margin: 0; }
    .capacity-note { margin-top: 2px; }
    .feedback { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .pagination { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .pagination button, .dialog-close, .locate-battery { padding: 6px 9px; border: 1px solid #d2dfd6; border-radius: 7px; background: #fff; color: #42614d; font-size: 11px; cursor: pointer; }
    .pagination button:hover, .locate-battery:hover { background: #edf5ef; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination #add-page { background: #38765a; border-color: #38765a; color: #fff; font-weight: 600; }
    .pagination #add-page:hover { background: #2c6249; border-color: #2c6249; }
    .page-indicator { min-width: 58px; text-align: center; color: #57695e; font-size: 11px; white-space: nowrap; }
    .alarm-summary { padding: 4px 8px; border: 1px solid #dce5df; border-radius: 6px; background: #f7faf8; color: #718078; font-size: 11px; white-space: nowrap; cursor: pointer; }
    .alarm-summary:disabled { cursor: default; }
    .alarm-summary.has-alert { border-color: #d58b74; color: #a33620; background: #fff0e8; }
    .alarm-dialog { width: min(540px, 90vw); max-height: 80dvh; padding: 22px; border: 1px solid #dce5df; border-radius: 16px; color: var(--ink); box-shadow: 0 18px 70px #193b2526; }
    .alarm-dialog::backdrop { background: #1d2c2533; }
    .dialog-heading, .alarm-group-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dialog-heading h2 { font-size: 18px; }
    .rules-note { color: #6c7b72; font-size: 12px; line-height: 1.8; }
    .alarm-group { margin-top: 16px; padding: 14px; border: 1px solid #ecd2c7; border-radius: 10px; background: #fff9f6; }
    .alarm-group h3 { margin: 0; font-size: 14px; }
    .alarm-group ul { margin: 10px 0 0; padding-left: 18px; color: #a13d29; font-size: 13px; line-height: 1.8; }
    .locate-battery { padding: 4px 8px; font-size: 10px; }
    @media (max-width: 1100px) { .topbar-inner { padding-inline: 16px; } main { padding-inline: 16px; } .battery-grid { gap: 10px; } .card { padding: 9px; } .unit { margin-left: 2px; font-size: 8px; } .capacity .unit, .capacity sup { font-size: 7px; } }
    @media (max-height: 680px) { .topbar { height: 40px; } main { padding-top: 10px; padding-bottom: 8px; } h1 { font-size: 21px; } .description { display: none; } .page-heading { margin-bottom: 10px; } .battery-grid { gap: 10px; } .card { padding: 8px; } .metric-row { padding-block: 1px; } .battery-stage { padding-block: 6px; } .capacity > div + div { margin-top: 4px; } }
    @media (prefers-reduced-motion: no-preference) { .water-wave { animation: water-flow 5s linear infinite; } .wave-back { animation-duration: 8s; animation-direction: reverse; } .card:nth-child(3n + 2) .water-wave { animation-delay: -1.7s; } .card:nth-child(3n) .water-wave { animation-delay: -3.3s; } @keyframes water-flow { to { transform: translateX(-50%); } } }
    @media (prefers-reduced-motion: reduce) { .empty-slot, .metric-row { transition: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m13 3-7 10h6l-1 8 7-11h-6l1-7Z"/></svg></span>电池监测<span class="brand-divider"></span><span class="brand-subtitle">Battery Monitor</span></div>
      <div class="snapshot"><span class="snapshot-dot" aria-hidden="true"></span>数据快照 · 示例</div>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <div><h1>电池BMS管理系统</h1><p class="description">告警：压差 &gt; 50 mV · 单节 &lt; 2.70 V · 2S 总压 &lt; 5.40 V</p></div>
      <div class="configuration"><span>本页 <b id="active-count">3</b> / 10</span><span>累计 <b id="total-count">3</b> 组</span><button type="button" id="alarm-summary" class="alarm-summary" aria-haspopup="dialog" disabled>告警 0 组</button></div>
    </div>
    <section class="battery-grid" id="batteries" aria-label="十个电池位，两排五列"></section>
    <footer class="page-footer">
      <div><p class="data-note">01–03 其余数值为示例；满充容量按各组上报显示，未上报为 —。</p><p class="capacity-note" id="capacity-note">* 容量单位与星号沿用原图。充电次数暂沿用原循环计数。</p></div>
      <nav class="pagination" aria-label="电池页面"><button type="button" id="previous-page" disabled>上一页</button><span class="page-indicator" id="page-indicator" aria-live="polite">第 1 / 1 页</span><button type="button" id="next-page" disabled>下一页</button><button type="button" id="add-page">＋ 新增页面</button></nav>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </footer>
    <noscript><p>请启用 JavaScript 以显示和添加电池组。</p></noscript>
  </main>
  <dialog id="alarm-dialog" class="alarm-dialog" aria-labelledby="alarm-dialog-title">
    <div class="dialog-heading"><h2 id="alarm-dialog-title">告警详情</h2><button type="button" id="close-alarms" class="dialog-close">关闭</button></div>
    <p class="rules-note">电芯压差 &gt; 50 mV；任一单节 &lt; 2.70 V；2S 总压 &lt; 5.40 V。等于阈值时不触发；缺失或无效读数单独提示。</p>
    <div id="alarm-details"></div>
  </dialog>
  <script>
    // 限制页面内常见缩放操作。
    document.addEventListener('wheel', event => {
      if (event.ctrlKey || event.metaKey) event.preventDefault();
    }, { passive: false });
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && ['+', '=', '-', '_'].includes(event.key)) event.preventDefault();
    });
    ['gesturestart', 'gesturechange'].forEach(type => {
      document.addEventListener(type, event => event.preventDefault(), { passive: false });
    });

    // 前三组保留其他示例读数；满充容量无默认值，等待各组独立上报。
    const batteries = [
      { id: '01', voltage: 8.000, cells: [4.003, 3.998], soc: 81, temperature: 28.35, current: 0, remainingCapacity: 1823, cycleCount: 1 },
      { id: '02', voltage: 8.000, cells: [4.003, 3.998], soc: 81, temperature: 28.35, current: 0, remainingCapacity: 1823, cycleCount: 1 },
      { id: '03', voltage: 8.000, cells: [4.003, 3.998], soc: 81, temperature: 28.35, current: 0, remainingCapacity: 1823, cycleCount: 1 }
    ];
    const readings = new Map(batteries.map(battery => [battery.id, battery]));
    const limits = { cellDeltaMv: 50, cellLowMv: 2700, packLowMv: 5400 };
    const storageKey = 'battery-monitor.layout.v2';
    const slotId = number => String(number).padStart(2, '0');
    let pageCount = 1;
    let currentPage = 1;
    let savedSlots = batteries.map(battery => battery.id);
    const validSlot = id => typeof id === 'string' && Number.isSafeInteger(Number(id)) && Number(id) > 0 && Number(id) <= pageCount * 10 && id === slotId(Number(id));
    try {
      const stored = JSON.parse(localStorage.getItem(storageKey));
      if (stored && Number.isSafeInteger(stored.pageCount) && stored.pageCount > 0 && Number.isSafeInteger(stored.pageCount * 10) && Array.isArray(stored.activeSlots)) {
        pageCount = stored.pageCount;
        currentPage = Number.isInteger(stored.currentPage) ? Math.max(1, Math.min(pageCount, stored.currentPage)) : 1;
        savedSlots = stored.activeSlots.filter(validSlot);
      } else {
        const legacy = JSON.parse(localStorage.getItem('battery-monitor.active-slots.v1'));
        if (Array.isArray(legacy)) savedSlots = legacy.filter(validSlot);
      }
    } catch { /* 存储不可用时仍可使用当前页面。 */ }
    const activeSlots = new Set(savedSlots);
    const grid = document.getElementById('batteries');
    const dialog = document.getElementById('alarm-dialog');
    let selectedAlarmId = null;
    const format = (number, digits = 0) => Number.isFinite(number) ? number.toFixed(digits) : '—';
    const pageSlots = () => Array.from({ length: 10 }, (_, index) => slotId((currentPage - 1) * 10 + index + 1));

    function assessBattery(battery) {
      const values = {};
      const alarms = [];
      if (!battery) return { values, alarms, deltaMv: null };
      const fields = [
        ['voltage', '总电压', battery.voltage, n => n >= 0],
        ['cell1', '第 1 节电压', battery.cells?.[0], n => n >= 0],
        ['cell2', '第 2 节电压', battery.cells?.[1], n => n >= 0],
        ['soc', '电量 SOC', battery.soc, n => n >= 0 && n <= 100],
        ['temperature', '温度', battery.temperature],
        ['current', '电流', battery.current],
        ['remainingCapacity', '剩余容量', battery.remainingCapacity, n => n >= 0],
        ['fullChargeCapacity', '满充容量', battery.fullChargeCapacity, n => n > 0],
        ['cycleCount', '充电次数', battery.cycleCount, n => Number.isInteger(n) && n >= 0]
      ];
      fields.forEach(([key, label, value, check]) => {
        // 满充容量未上报时显示占位符；已上报但无效的数值仍告警。
        if (key === 'fullChargeCapacity' && value == null) return;
        if (Number.isFinite(value) && (!check || check(value))) values[key] = value;
        else alarms.push({ code: 'invalid-' + key, fields: [key], message: label + (value == null ? '：读数缺失' : '：读数无效') });
      });
      // 原始电压精度为 mV，先转整数再判断，避免浮点误差触发边界告警。
      const cell1Mv = Number.isFinite(values.cell1) ? Math.round(values.cell1 * 1000) : null;
      const cell2Mv = Number.isFinite(values.cell2) ? Math.round(values.cell2 * 1000) : null;
      const deltaMv = cell1Mv !== null && cell2Mv !== null ? Math.abs(cell1Mv - cell2Mv) : null;
      if (deltaMv !== null && deltaMv > limits.cellDeltaMv) {
        alarms.push({ code: 'cell-delta', fields: ['cell1', 'cell2', 'delta'], message: `电芯压差过大：${deltaMv} mV > ${limits.cellDeltaMv} mV` });
      }
      [cell1Mv, cell2Mv].forEach((mv, index) => {
        if (mv !== null && mv < limits.cellLowMv) alarms.push({ code: 'cell-low-' + (index + 1), fields: ['cell' + (index + 1)], message: `第 ${index + 1} 节电压过低：${(mv / 1000).toFixed(3)} V < 2.700 V` });
      });
      if (Number.isFinite(values.voltage) && Math.round(values.voltage * 1000) < limits.packLowMv) {
        alarms.push({ code: 'pack-low', fields: ['voltage'], message: `总电压过低：${values.voltage.toFixed(3)} V < 5.400 V` });
      }
      return { values, alarms, deltaMv };
    }

    function renderSlot(id) {
      if (!activeSlots.has(id)) {
        return `<button type="button" class="empty-slot" data-action="add" data-slot="${id}" aria-label="添加电池 ${id}"><span class="slot-number" aria-hidden="true">${id}</span><span class="add-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="add-label">添加电池组</span></button>`;
      }
      const battery = readings.get(id);
      const { values, alarms, deltaMv } = assessBattery(battery);
      const hasSoc = Number.isFinite(values.soc);
      const level = (values.soc ?? 0) / 100;
      const state = battery ? (values.current === 0 ? '静置' : '有电流') : '等待数据';
      const fieldAlerts = key => alarms.filter(alarm => alarm.fields.includes(key));
      const stateHtml = alarms.length
        ? `<button type="button" class="state alert-state" data-alert-slot="${id}" aria-haspopup="dialog" aria-label="查看电池 ${id} 的 ${alarms.length} 项异常">异常 ${alarms.length}</button>`
        : `<span class="state${battery ? '' : ' waiting'}">${state}</span>`;
      const metrics = [
        ['voltage', '总电压', format(values.voltage, 3), 'V'],
        ['cell1', '第 1 节电压', format(values.cell1, 3), 'V'],
        ['cell2', '第 2 节电压', format(values.cell2, 3), 'V'],
        ['delta', '电芯压差', format(deltaMv), 'mV'],
        ['temperature', '温度', format(values.temperature, 2), '℃'],
        ['current', '电流', format(values.current), 'mA'],
        ['cycleCount', '充电次数', format(values.cycleCount), '次']
      ];
      return `
        <article class="card${alarms.length ? ' has-alert' : ''}" id="slot-${id}" tabindex="-1" aria-labelledby="battery-${id}">
          <header class="card-header"><h2 id="battery-${id}">电池 ${id}</h2><div class="card-actions">${stateHtml}<button type="button" class="remove-slot" data-action="remove" data-slot="${id}" aria-label="移除电池 ${id}" title="移除电池 ${id}，恢复为空位">移除</button></div></header>
          <div class="battery-stage">
            <div class="battery${hasSoc ? '' : ' awaiting'}" role="img" aria-label="${hasSoc ? '剩余电量 ' + values.soc + '%' : '剩余电量暂无有效数据'}" style="--soc: ${values.soc ?? 0}%; --water-top: hsl(145 40% ${95 - 45 * level}%); --water-bottom: hsl(145 36% ${97 - 39 * level}%); --water-back: hsl(145 38% ${89 - 45 * level}%)">
              <div class="battery-inner" aria-hidden="true">
                ${hasSoc ? '<div class="battery-fill"><svg class="water-wave wave-back" viewBox="0 0 200 16" preserveAspectRatio="none"><path d="M0 8 Q25 -2 50 8 T100 8 T150 8 T200 8 V16 H0Z"/></svg><svg class="water-wave" viewBox="0 0 200 16" preserveAspectRatio="none"><path d="M0 8 Q25 -2 50 8 T100 8 T150 8 T200 8 V16 H0Z"/></svg></div>' : ''}
                <div class="soc-content"><div class="soc-value">${format(values.soc)}${hasSoc ? '<small>%</small>' : ''}</div><div class="soc-label">电量 SOC</div></div>
              </div>
            </div>
            <dl class="capacity" aria-describedby="capacity-note">${[['remainingCapacity', '剩余容量'], ['fullChargeCapacity', '满充容量']].map(([key, label]) => `<div><dt>${label}</dt><dd class="${fieldAlerts(key).length ? 'is-alert' : ''}">${format(values[key])}<span class="unit">mAh</span>${Number.isFinite(values[key]) ? '<sup>*</sup>' : ''}</dd></div>`).join('')}</dl>
          </div>
          <dl class="metrics">${metrics.map(([key, label, value, unit]) => `<div class="metric-row${fieldAlerts(key).length ? ' is-alert' : ''}" title="${fieldAlerts(key).map(alarm => alarm.message).join('；')}"><dt>${fieldAlerts(key).length ? '<span class="row-alert-marker" aria-label="异常">!</span>' : ''}${label}</dt><dd>${value}<span class="unit">${unit}</span></dd></div>`).join('')}</dl>
        </article>`;
    }

    function allAlerts() {
      return [...activeSlots].sort((a, b) => Number(a) - Number(b)).map(id => ({ id, ...assessBattery(readings.get(id)) })).filter(item => item.alarms.length);
    }

    function renderAlarmDetails() {
      const items = allAlerts().filter(item => !selectedAlarmId || item.id === selectedAlarmId);
      document.getElementById('alarm-details').innerHTML = items.length ? items.map(({ id, alarms }) => `<section class="alarm-group"><div class="alarm-group-heading"><h3>电池 ${id} · 第 ${Math.ceil(Number(id) / 10)} 页</h3><button type="button" class="locate-battery" data-locate-slot="${id}">定位电池 ${id}</button></div><ul>${alarms.map(alarm => `<li>${alarm.message}</li>`).join('')}</ul></section>`).join('') : '<p>当前没有异常。</p>';
    }

    function showAlarms(id = null) {
      selectedAlarmId = id;
      renderAlarmDetails();
      dialog.showModal();
    }

    function renderDashboard() {
      const slots = pageSlots();
      grid.innerHTML = slots.map(renderSlot).join('');
      document.getElementById('active-count').textContent = slots.filter(id => activeSlots.has(id)).length;
      document.getElementById('total-count').textContent = activeSlots.size;
      document.getElementById('page-indicator').textContent = `第 ${currentPage} / ${pageCount} 页`;
      document.getElementById('previous-page').disabled = currentPage === 1;
      document.getElementById('next-page').disabled = currentPage === pageCount;
      const summary = document.getElementById('alarm-summary');
      const count = allAlerts().length;
      summary.textContent = `告警 ${count} 组`;
      summary.className = 'alarm-summary' + (count ? ' has-alert' : '');
      summary.disabled = count === 0;
      if (dialog.open) renderAlarmDetails();
    }

    function saveLayout(message = '') {
      try {
        localStorage.setItem(storageKey, JSON.stringify({ pageCount, currentPage, activeSlots: [...activeSlots] }));
      } catch { message += ' 浏览器未允许保存，刷新后将恢复上次状态。'; }
      document.getElementById('feedback').textContent = message;
    }

    function changePage(page) {
      if (!Number.isInteger(page) || page < 1 || page > pageCount) return;
      currentPage = page;
      renderDashboard();
      saveLayout(`已切换到第 ${page} 页。`);
    }

    function addPage() {
      pageCount += 1;
      changePage(pageCount);
    }

    function setSlotActive(id, enabled) {
      if (!validSlot(id)) return;
      if (enabled) activeSlots.add(id);
      else activeSlots.delete(id);
      renderDashboard();
      saveLayout(enabled ? `已添加电池 ${id}，${readings.has(id) ? '显示已有快照。' : '等待接入数据。'}` : `已移除电池 ${id}，可点击 ＋ 重新添加。`);
    }

    grid.addEventListener('click', event => {
      const alertButton = event.target.closest('button[data-alert-slot]');
      if (alertButton) return showAlarms(alertButton.dataset.alertSlot);
      const button = event.target.closest('button[data-slot]');
      if (!button) return;
      const id = button.dataset.slot;
      const removing = button.dataset.action === 'remove';
      setSlotActive(id, !removing);
      const focusTarget = removing ? grid.querySelector(`button[data-slot="${id}"]`) : document.getElementById('slot-' + id);
      focusTarget.focus({ preventScroll: true });
    });
    document.getElementById('previous-page').addEventListener('click', () => changePage(currentPage - 1));
    document.getElementById('next-page').addEventListener('click', () => changePage(currentPage + 1));
    document.getElementById('add-page').addEventListener('click', addPage);
    document.getElementById('alarm-summary').addEventListener('click', () => showAlarms());
    document.getElementById('close-alarms').addEventListener('click', () => dialog.close());
    document.getElementById('alarm-details').addEventListener('click', event => {
      const button = event.target.closest('button[data-locate-slot]');
      if (!button) return;
      dialog.close();
      changePage(Math.ceil(Number(button.dataset.locateSlot) / 10));
      document.getElementById('slot-' + button.dataset.locateSlot).focus({ preventScroll: true });
    });

    // 按电池组 ID 传入完整快照；V、mA、℃、mAh。fullChargeCapacity 为该组上报值。
    // null 表示尚无数据；缺失字段不复用旧值，也不从 SOC 或其他电池组推算。
    window.batteryMonitor = {
      updateBattery(id, sample) {
        if (!validSlot(id) || !activeSlots.has(id)) return false;
        if (sample === null) readings.delete(id);
        else readings.set(id, { ...sample, cells: Array.isArray(sample.cells) ? [...sample.cells] : sample.cells });
        renderDashboard();
        return true;
      }
    };
    renderDashboard();
  </script>
</body>
</html>
